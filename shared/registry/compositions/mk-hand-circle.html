<!DOCTYPE html><!-- hyperframes-registry-item: mk-hand-circle -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* EL ÇİZİMİ DAİRE+OK (2026-10-06): ekrandaki bir yeri (grafik/sayı) elle çizilmiş daireyle işaretler. Saydam kök, position:absolute (Stüdyo'da alta kaymasın), visibility:hidden varsayılan + tl.set(0.001) + DUR-0.02 gizle. */
      #mk-hc-root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; visibility: hidden; font-family: "Montserrat","Inter",-apple-system,sans-serif; }
      #mk-hc-svg { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:visible; }
      #mk-hc-note { position:absolute; font-weight:900; font-size:34px; color:#fff; text-shadow:0 3px 14px rgba(0,0,0,0.6); opacity:0; white-space:nowrap; letter-spacing:0.04em; }
    </style>
  </head>
  <body>
    <div id="mk-hc-root" data-composition-id="mk-hand-circle" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-hc-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <svg id="mk-hc-svg" viewBox="0 0 1080 1920"><path id="mk-hc-ring" fill="none" stroke="var(--acc,#f0b429)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path id="mk-hc-arrow" fill="none" stroke="var(--acc,#f0b429)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><div id="mk-hc-note"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#f0b429",
          note: "BURASI KRİTİK",
          posX: 540,
          posY: 900,
          boxW: 360,
          boxH: 170
        };
        var DUR = 8;
        var root = document.getElementById("mk-hc-root");
        root.style.setProperty("--acc", CONFIG.accent);
        var cx = CONFIG.posX, cy = CONFIG.posY, rx = CONFIG.boxW / 2, ry = CONFIG.boxH / 2;
        var N = 40, pts = [];
        for (var i = 0; i <= N; i++) {
          var a = -2.2 + (i / N) * (Math.PI * 2 + 0.55), w = 1 + 0.06 * Math.sin(i * 0.9) + 0.07 * (i / N);
          pts.push([cx + rx * w * Math.cos(a), cy + ry * w * Math.sin(a)]);
        }
        var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
        var ring = document.getElementById("mk-hc-ring"); ring.setAttribute("d", d);
        var arrow = document.getElementById("mk-hc-arrow");
        var note = document.getElementById("mk-hc-note");
        note.textContent = CONFIG.note;
        var topY = cy - ry * 1.08, ny = topY - 150;
        note.style.left = "0px"; note.style.width = "1080px"; note.style.textAlign = "center";
        note.style.top = (ny - 22) + "px";
        var sx = cx + 70, sy = ny + 36;
        arrow.setAttribute("d", "M" + sx + " " + sy + " Q" + (sx + 40) + " " + (sy + 50) + " " + (cx + 20) + " " + (topY - 10) + " M" + (cx + 20) + " " + (topY - 10) + " l-4 -30 M" + (cx + 20) + " " + (topY - 10) + " l-30 -12");
        var L = 4000; ring.style.strokeDasharray = L; ring.style.strokeDashoffset = L;
        arrow.style.strokeDasharray = 600; arrow.style.strokeDashoffset = 600;
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.to(ring, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 0.15);
        tl.to(arrow, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 1.0);
        tl.fromTo(note, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4 }, 1.3);
        tl.to([ring, arrow, note], { opacity: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.5);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-hand-circle"] = tl;
      })();
    </script>
  </body>
</html>
