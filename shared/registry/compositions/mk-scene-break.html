<!-- hyperframes-registry-item: mk-scene-break -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      /* KİLİT (2026-09, GERÇEK tam ekran): önceki sürüm pro-card (1920x1080
         iç sahne) mekanizmasını kullanıyordu — Stüdyo canlı önizlemede bunu
         SADECE görünür karenin (sol-üst 1080x1080) İÇİNDE gösteriyor, geri
         kalan alt ~840px hiç boyanmıyordu ("tam sayfa olmadı"). Kanıtlanmış
         TAM EKRAN mekanizması instagram-follow.html'de kullanılan desendir:
         host native 1080x1920 (dikey, gerçek video kanvasıyla birebir) VE
         asıl görünür içerik class="clip" ile işaretlenmiş olmalı (bkz.
         instagram-follow.html #card). Bu dosya artık o deseni birebir
         izliyor; build_engine.py da data-width/height=1080/1920 gören her
         registry öğesini otomatik olarak ig-follow-host ile monte ediyor. */
      #mk-sb-root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
        /* KİLİT (2026-10, performans): önceki sürümde ince noktalı
           tekrarlanan radial-gradient doku vardı ("background:
           radial-gradient(circle,...) 0 0 / 46px 46px, ...") — Stüdyo
           önizlemesinde "çok ağır / yavaş yükleniyor" şikayetine yol açtı.
           Görsel katkısı küçüktü, render maliyeti büyüktü — kaldırıldı,
           sade vignette gradient kaldı. */
        background: radial-gradient(120% 60% at 50% 6%, #262a45 0%, #14151f 55%, #0a0a10 100%);
        /* KİLİT (2026-10, KÖK SEBEP — "görselim gelmiyor, scene-break'ten
           sonra düzeliyor" hatası): bu kök div opak bir arkaplan taşıyor ve
           eskiden varsayılan olarak visibility:visible'dı — sayfa yüklenir
           yüklenmez DOM'da duruyor, Stüdyo onu kendi [data-start,
           data-duration] penceresinde henüz "sürmemiş" olsa bile ekranı
           (ve altındaki #video-wrap'ı) baştan beri kaplıyordu. Sadece KENDİ
           iç timeline'ı bir kere oynatılıp sonuna varınca (`tl.set(root,
           {visibility:"hidden"}, DUR-0.02)`) gizleniyordu — yani "scene
           kartı girip çıktıktan sonra görselim geri geliyor" tam olarak bu
           yüzdendi. Düzeltme: kök varsayılan olarak gizli başlasın, kendi
           timeline'ı başında (t=0) görünür yapsın, sonunda yine gizlesin. */
        visibility: hidden;
      }
      #mk-sb-head {
        position: absolute;
        left: 60px;
        top: 220px;
        width: 960px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 30px 34px;
        border-radius: 26px;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 54px rgba(0, 0, 0, 0.45);
        opacity: 0;
      }
      #mk-sb-head-left {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      #mk-sb-ico {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(150deg, var(--acc, #ff4d4d), rgba(255, 255, 255, 0.15));
        font-size: 30px;
      }
      #mk-sb-heading {
        font-weight: 800;
        font-size: 29px;
        color: #f2f2f6;
        letter-spacing: 0.01em;
      }
      #mk-sb-headval {
        font-weight: 800;
        font-size: 36px;
        color: #ffffff;
      }
      #mk-sb-badge {
        position: absolute;
        left: 60px;
        top: 360px;
        padding: 12px 26px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 24px;
        color: #14151f;
        background: var(--acc, #ff4d4d);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.4);
        opacity: 0;
      }
      #mk-sb-line {
        position: absolute;
        left: 96px;
        top: 440px;
        width: 3px;
        height: 260px;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.55) 0,
          rgba(255, 255, 255, 0.55) 10px,
          transparent 10px,
          transparent 20px
        );
        transform-origin: top center;
      }
      #mk-sb-rows {
        position: absolute;
        left: 60px;
        top: 530px;
        width: 960px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .mk-sb-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 28px 34px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0;
        transform: translateY(18px);
      }
      .mk-sb-row-label {
        font-weight: 650;
        font-size: 25px;
        color: #d8d8e2;
      }
      .mk-sb-row-value {
        font-weight: 800;
        font-size: 30px;
        color: #ffffff;
      }
      #mk-sb-foot {
        position: absolute;
        left: 60px;
        bottom: 140px;
        width: 960px;
        text-align: left;
        font-size: 18px;
        font-weight: 650;
        color: rgba(255, 255, 255, 0.5);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="mk-sb-root"
      data-composition-id="mk-scene-break"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="8"
    >
      <div
        id="mk-sb-clip"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px"
      >
        <div id="mk-sb-head">
          <div id="mk-sb-head-left">
            <div id="mk-sb-ico">📊</div>
            <div id="mk-sb-heading"></div>
          </div>
          <div id="mk-sb-headval"></div>
        </div>
        <div id="mk-sb-badge"></div>
        <div id="mk-sb-line"></div>
        <div id="mk-sb-rows"></div>
        <div id="mk-sb-foot"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters ----
           "Sahne kesme" kartı: timeline.json → proCards[].copy ile doldurulur. */
        var CONFIG = {
          accent: "#ff4d4d",
          icon: "📊",
          heading: "BİST100 ENDEKSİ",
          headingValue: "15.200",
          badge: "-%20",
          rows: [
            { label: "Zirve (Mayıs)", value: "15.200" },
            { label: "Bugün", value: "12.900" },
          ],
          footnote: "ÖRNEK VERİDİR. YATIRIM TAVSİYESİ DEĞİLDİR.",
        };

        var DUR = 8;
        var root = document.getElementById("mk-sb-root");
        root.style.setProperty("--acc", CONFIG.accent);
        document.getElementById("mk-sb-ico").textContent = CONFIG.icon;
        document.getElementById("mk-sb-heading").textContent = CONFIG.heading;
        document.getElementById("mk-sb-headval").textContent = CONFIG.headingValue;
        document.getElementById("mk-sb-badge").textContent = CONFIG.badge;
        document.getElementById("mk-sb-foot").textContent = CONFIG.footnote;

        var rowsEl = document.getElementById("mk-sb-rows");
        var rowEls = (CONFIG.rows || []).map(function (r) {
          var d = document.createElement("div");
          d.className = "mk-sb-row";
          var l = document.createElement("div");
          l.className = "mk-sb-row-label";
          l.textContent = r.label;
          var v = document.createElement("div");
          v.className = "mk-sb-row-value";
          v.textContent = r.value;
          d.appendChild(l);
          d.appendChild(v);
          rowsEl.appendChild(d);
          return d;
        });
        var lineH = 80 + rowEls.length * 84;
        document.getElementById("mk-sb-line").style.height = lineH + "px";

        var tl = gsap.timeline({ paused: true });
        /* KİLİT 2026-10 (v2 — ileri/geri scrub düzeltmesi): kök CSS'te
           visibility:hidden ile başlıyor. GSAP, bu iç timeline'ın penceresi
           DIŞINA (öncesine) kaydırıldığında yerel zamanı 0'a sabitler
           (clamp) — "visible" komutu TAM 0 anında olursa, pencere öncesine
           dönüldüğünde de 0'a sabitlenip yine görünür kalıyordu (bu yüzden
           "sahneye gidip geri geldiğimde sorun tekrar oluyor" hatası oldu).
           Çözüm: görünür yapma komutunu 0'dan hafifçe (1ms) SONRAYA al —
           böylece 0'a sabitlenen "pencere öncesi" durumu CSS varsayılanı
           (hidden) olarak kalır, pencere içindeyken fark edilmeyecek kadar
           küçük bir gecikmeyle (1ms) görünür olur. */
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.to("#mk-sb-head", { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
        tl.to("#mk-sb-badge", { opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.65);
        /* KİLİT 2026-10, Stüdyo lint hatası: CSS'te statik transform:scaleY(0)
           ile GSAP scaleY tween'i birlikte kullanmak riskli (GSAP tüm
           transform'u yeniden yazıp CSS'teki durumu siler) — tl.fromTo bu
           kuraldan muaf, başlangıç durumunu kendi üstleniyor. */
        tl.fromTo("#mk-sb-line", { scaleY: 0 }, { scaleY: 1, duration: 0.55, ease: "power1.inOut" }, 0.95);
        rowEls.forEach(function (el, i) {
          tl.to(el, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.55 + i * 0.5);
        });
        tl.to("#mk-sb-foot", { opacity: 1, duration: 0.5 }, 1.9 + rowEls.length * 0.5);
        tl.to(
          ["#mk-sb-head", "#mk-sb-badge", "#mk-sb-line", "#mk-sb-foot"].concat(rowEls),
          { opacity: 0, duration: 0.35, ease: "power2.in" },
          DUR - 0.5
        );
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-scene-break"] = tl;
      })();
    </script>
  </body>
</html>
