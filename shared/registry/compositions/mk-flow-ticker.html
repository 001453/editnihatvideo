<!DOCTYPE html><!-- hyperframes-registry-item: mk-flow-ticker -->

<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* AKAN PRO KART (2026-10-06 v2): kartlar soldan kayarak çapraz kademeli girer, hafif süzülür, sağa çıkar (haber şeridi DEĞİL).
         Saydam kök; visibility:hidden varsayılan + tl.set(0.001) görünür + DUR-0.02 gizle. */
      #mk-ft-root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; visibility: hidden; font-family: "Montserrat","Inter",-apple-system,sans-serif; }
      #mk-ft-bar { position:absolute; left:0; top:0; width:1080px; height:600px; opacity:1; }
      #mk-ft-label { position:absolute; left:40px; top:0; padding:10px 22px; border-radius:999px; font-weight:900; font-size:22px; letter-spacing:0.08em; color:#14151f; background:var(--acc,#f0b429); opacity:0; }
      #mk-ft-track { position:absolute; left:0; top:0; width:1080px; height:600px; }
      .mk-ft-card { position:absolute; width:520px; padding:18px 26px 18px 34px; border-radius:24px; background:rgba(10,12,20,0.66); border:1px solid rgba(255,255,255,0.16); box-shadow:0 14px 40px rgba(0,0,0,0.35); opacity:0; }
      .mk-ft-card::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:6px; border-radius:3px; background:var(--acc,#f0b429); }
      .mk-ft-k { font-weight:650; font-size:22px; color:#c8c8d4; margin-bottom:4px; }
      .mk-ft-v { font-weight:900; font-size:38px; color:#ffffff; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-5o9j" id="mk-ft-root" data-composition-id="mk-flow-ticker" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div data-hf-id="hf-trs2" id="mk-ft-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-ft-bar"><div id="mk-ft-label"></div><div id="mk-ft-track"></div></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#f0b429",
          label: "TÜPRAŞ",
          entries: [{"label": "Nakit fazlası", "value": "130 milyar TL"}, {"label": "Takip seviyeleri", "value": "366 · 354 · 336"}, {"label": "2Ç kâr", "value": "46 milyar TL"}],
          posX: 40,
          posY: 1330
        };
        var DUR = 8;
        var root = document.getElementById("mk-ft-root");
        root.style.setProperty("--acc", CONFIG.accent);
        var bar = document.getElementById("mk-ft-bar");
        bar.style.top = CONFIG.posY + "px";
        document.getElementById("mk-ft-label").style.left = ((CONFIG.posX == null ? 40 : CONFIG.posX)) + "px";
        var lab = document.getElementById("mk-ft-label"); lab.textContent = CONFIG.label;
        var track = document.getElementById("mk-ft-track");
        var cards = (CONFIG.entries || []).map(function (r, i) {
          var c = document.createElement("div"); c.className = "mk-ft-card";
          c.style.left = ((CONFIG.posX == null ? 40 : CONFIG.posX) + i * 70) + "px"; c.style.top = (60 + i * 118) + "px";
          var k = document.createElement("div"); k.className = "mk-ft-k"; k.textContent = r.label;
          var v = document.createElement("div"); v.className = "mk-ft-v"; v.textContent = r.value;
          c.appendChild(k); c.appendChild(v); track.appendChild(c); return c;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.fromTo(lab, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.05);
        cards.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0, x: -700 }, { opacity: 1, x: 0, duration: 0.7, ease: "power3.out" }, 0.3 + i * 0.55);
          tl.to(c, { x: 18, duration: 2.2, ease: "sine.inOut" }, 1.1 + i * 0.55);
        });
        tl.to(cards.concat([lab]), { opacity: 0, x: 600, duration: 0.5, ease: "power2.in", stagger: 0.08 }, DUR - 0.8);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-flow-ticker"] = tl;
      })();
    </script>
  </body>
</html>
