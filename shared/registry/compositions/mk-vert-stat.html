<!-- hyperframes-registry-item: mk-vert-stat -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* DİKEY PRO KART (2026-10-06): yüz dışı boş alanda (sağ/sol kenar) dikey duran dar sütun kart.
         Saydam kök; visibility:hidden varsayılan + tl.set(0.001) görünür + DUR-0.02 gizle (scene-break ile aynı mekanizma). */
      #mk-vs-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: transparent; visibility: hidden; font-family: "Montserrat","Inter",-apple-system,sans-serif; }
      #mk-vs-col { position:absolute; width:330px; padding:26px 26px 24px; border-radius:26px; background:rgba(10,12,20,0.62); border:1px solid rgba(255,255,255,0.16); box-shadow:0 18px 50px rgba(0,0,0,0.35); opacity:0; }
      #mk-vs-col::before { content:""; position:absolute; left:0; top:26px; bottom:26px; width:6px; border-radius:3px; background:var(--acc,#f0b429); }
      #mk-vs-badge { display:inline-block; padding:8px 16px; border-radius:10px; font-weight:800; font-size:17px; color:#14151f; background:var(--acc,#f0b429); white-space:nowrap; }
      #mk-vs-heading { margin-top:14px; font-weight:700; font-size:19px; letter-spacing:0.08em; color:#c8c8d4; line-height:1.25; }
      #mk-vs-headval { margin-top:8px; font-weight:900; font-size:78px; line-height:1; color:#fff; letter-spacing:-0.03em; }
      #mk-vs-list { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
      .mk-vs-row { padding:12px 16px; border-radius:14px; background:rgba(255,255,255,0.08); opacity:0; }
      .mk-vs-row-label { font-weight:650; font-size:17px; color:#c8c8d4; }
      .mk-vs-row-value { margin-top:2px; font-weight:800; font-size:30px; color:var(--acc,#f0b429); }
      #mk-vs-foot { margin-top:14px; font-size:13px; font-weight:650; color:rgba(255,255,255,0.55); }
    </style>
  </head>
  <body>
    <div id="mk-vs-root" data-composition-id="mk-vert-stat" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-vs-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-vs-col">
          <div id="mk-vs-badge"></div>
          <div id="mk-vs-heading"></div>
          <div id="mk-vs-headval"></div>
          <div id="mk-vs-list"></div>
          <div id="mk-vs-foot"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#f0b429",
          badge: "MARJ",
          heading: "MOTORİN MARJI",
          headingValue: "-15 $",
          rows: [
            { label: "Önceki", value: "85 $" },
            { label: "Şimdi", value: "70 $" }
          ],
          footnote: "YATIRIM TAVSİYESİ DEĞİLDİR.",
          posX: 710,
          posY: 430
        };
        var DUR = 8;
        var root = document.getElementById("mk-vs-root");
        root.style.setProperty("--acc", CONFIG.accent);
        var col = document.getElementById("mk-vs-col");
        col.style.left = CONFIG.posX + "px"; col.style.top = CONFIG.posY + "px";
        function T(id, v) { document.getElementById(id).textContent = v; }
        T("mk-vs-badge", CONFIG.badge); T("mk-vs-heading", CONFIG.heading); T("mk-vs-headval", CONFIG.headingValue); T("mk-vs-foot", CONFIG.footnote);
        var listEl = document.getElementById("mk-vs-list");
        var rowEls = (CONFIG.rows || []).map(function (r) {
          var d = document.createElement("div"); d.className = "mk-vs-row";
          var l = document.createElement("div"); l.className = "mk-vs-row-label"; l.textContent = r.label;
          var v = document.createElement("div"); v.className = "mk-vs-row-value"; v.textContent = r.value;
          d.appendChild(l); d.appendChild(v); listEl.appendChild(d); return d;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.fromTo(col, { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
        rowEls.forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9 + i * 0.45);
        });
        tl.to(col, { opacity: 0, x: 90, duration: 0.45, ease: "power2.in" }, DUR - 0.55);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-vert-stat"] = tl;
      })();
    </script>
  </body>
</html>
