<!DOCTYPE html><!-- hyperframes-registry-item: mk-ring-stat -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* SAYAN HALKA KARTI (2026-10-06): yüzde/oran halkası + sayarak gelen büyük sayı. Saydam kök, position:absolute (Stüdyo'da alta kaymasın), visibility:hidden varsayılan + tl.set(0.001) + DUR-0.02 gizle. */
      #mk-rs-root { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; visibility: hidden; font-family: "Montserrat","Inter",-apple-system,sans-serif; }
      #mk-rs-card { position:absolute; width:330px; padding:26px 26px 24px; border-radius:26px; background:rgba(10,12,20,0.66); border:1px solid rgba(255,255,255,0.16); box-shadow:0 18px 50px rgba(0,0,0,0.35); opacity:0; text-align:center; }
      #mk-rs-label { font-weight:900; font-size:20px; letter-spacing:0.07em; color:#14151f; background:var(--acc,#f0b429); display:inline-block; padding:7px 16px; border-radius:999px; margin-bottom:16px; }
      #mk-rs-ringwrap { position:relative; width:220px; height:220px; margin:0 auto 14px; }
      #mk-rs-ringwrap svg { width:220px; height:220px; transform:rotate(-90deg); }
      #mk-rs-num { position:absolute; left:0; top:0; width:220px; height:220px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:54px; color:#fff; }
      #mk-rs-cap { font-weight:650; font-size:21px; color:#c8c8d4; line-height:1.3; }
    </style>
  </head>
  <body>
    <div id="mk-rs-root" data-composition-id="mk-ring-stat" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-rs-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-rs-card"><div id="mk-rs-label"></div><div id="mk-rs-ringwrap"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="94" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="16"/><circle id="mk-rs-arc" cx="110" cy="110" r="94" fill="none" stroke="var(--acc,#f0b429)" stroke-width="16" stroke-linecap="round" stroke-dasharray="590.6" stroke-dashoffset="590.6"/></svg><div id="mk-rs-num"></div></div><div id="mk-rs-cap"></div></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#f0b429",
          label: "ENFLASYON",
          value: 30,
          suffix: "%",
          caption: "57 ay sonra ilk kez %30 altı",
          posX: 700,
          posY: 430
        };
        var DUR = 8;
        function shatter(el, tl, t0, o) {
          o = o || {}; var cols = o.cols || 4, rows = o.rows || 3;
          tl.time(Math.max(t0 - 0.02, 0), true);
          var w = el.offsetWidth, h = el.offsetHeight, frags = [];
          for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
            var f = el.cloneNode(true); f.removeAttribute("id");
            [].forEach.call(f.querySelectorAll("[id]"), function (n) { n.removeAttribute("id"); });
            f.style.clipPath = "inset(" + (r * h / rows) + "px " + (w - (c + 1) * w / cols) + "px " + (h - (r + 1) * h / rows) + "px " + (c * w / cols) + "px)";
            f.style.transformOrigin = ((c + 0.5) * w / cols) + "px " + ((r + 0.5) * h / rows) + "px";
            f.style.pointerEvents = "none"; f.style.opacity = "0";
            el.parentNode.appendChild(f); frags.push({ f: f, c: c, r: r });
          }
          tl.time(0, true);
          tl.set(el, { opacity: 0 }, t0);
          frags.forEach(function (g, i) {
            var dx = (g.c - (cols - 1) / 2) * 120 + ((i * 37) % 50 - 25), dy = (g.r - (rows - 1) / 2) * 50 - 80 + ((i * 53) % 40), rot = ((i * 29) % 90) - 45;
            tl.set(g.f, { opacity: 0 }, 0);
            tl.set(g.f, { opacity: 1 }, t0);
            tl.to(g.f, { x: dx, y: dy + 420, rotation: rot, opacity: 0, duration: 0.8, ease: "power2.in" }, t0);
          });
        }

        var root = document.getElementById("mk-rs-root");
        root.style.setProperty("--acc", CONFIG.accent);
        var card = document.getElementById("mk-rs-card");
        card.style.left = CONFIG.posX + "px"; card.style.top = CONFIG.posY + "px";
        document.getElementById("mk-rs-label").textContent = CONFIG.label;
        document.getElementById("mk-rs-cap").textContent = CONFIG.caption;
        var num = document.getElementById("mk-rs-num"), arc = document.getElementById("mk-rs-arc");
        var st = { v: 0 }; var target = CONFIG.value;
        var frac = Math.max(0, Math.min(1, target / 100));
        function draw() { num.textContent = Math.round(st.v) + CONFIG.suffix; }
        draw();
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.fromTo(card, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        tl.to(st, { v: target, duration: 1.8, ease: "power2.out", onUpdate: draw }, 0.5);
        tl.to(arc, { strokeDashoffset: 590.6 * (1 - frac), duration: 1.8, ease: "power2.out" }, 0.5);
        shatter(card, tl, DUR - 0.95, { cols: 3, rows: 4 });
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-ring-stat"] = tl;
      })();
    </script>
  </body>
</html>
