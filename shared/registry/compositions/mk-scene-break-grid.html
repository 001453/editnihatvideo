<!-- hyperframes-registry-item: mk-scene-break-grid -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* KİLİT (2026-10): bu kök varsayılan visibility:hidden ile başlar,
         GSAP tl.set(...,0.001) ile görünür yapılır, DUR-0.02'de yine
         gizlenir. Tam gerekçe: shared/PRO_CARDS.md "KİLİT (2026-10, KÖK
         SEBEP)" bölümü. mk-scene-break.html ile BİREBİR aynı mekanizma —
         burada değiştirme, sadece aşağıdaki iç tasarımı değiştir. */
      #mk-sb-root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
        background: linear-gradient(170deg, #171224 0%, #0a0a10 70%);
        visibility: hidden;
      }

      #mk-sb-heading {
        position: absolute; left: 60px; top: 250px; width: 960px; font-weight: 800;
        font-size: 34px; color: #f2f2f6; opacity: 0;
      }
      #mk-sb-badge {
        position: absolute; left: 60px; top: 330px; padding: 10px 24px; border-radius: 999px;
        font-weight: 800; font-size: 20px; color: #14151f; background: var(--acc, #ff4d4d); opacity: 0;
      }
      #mk-sb-rows { position: absolute; left: 60px; top: 460px; width: 960px; display: flex; gap: 24px; }
      .mk-sb-row {
        flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 26px; padding: 44px 28px; text-align: center; opacity: 0; transform: translateY(26px);
      }
      .mk-sb-row-icon { font-size: 52px; margin-bottom: 20px; }
      .mk-sb-row-value { font-weight: 800; font-size: 34px; color: #ffffff; margin-bottom: 14px; }
      .mk-sb-row-label { font-weight: 650; font-size: 21px; color: #b9b9c6; }
      #mk-sb-headval {
        position: absolute; left: 60px; top: 780px; width: 960px; text-align: center;
        font-weight: 800; font-size: 46px; color: var(--acc, #ff4d4d); opacity: 0;
      }
      #mk-sb-foot { position: absolute; left: 60px; bottom: 140px; width: 960px; font-size: 18px; font-weight: 650; color: rgba(255,255,255,0.5); opacity: 0; }

    </style>
  </head>
  <body>
    <div id="mk-sb-root" data-composition-id="mk-scene-break-grid" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-sb-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-sb-heading"></div>
        <div id="mk-sb-badge"></div>
        <div id="mk-sb-rows"></div>
        <div id="mk-sb-headval"></div>
        <div id="mk-sb-foot"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#ff4d4d",
          icon: "📊",
          heading: "BİST100 ENDEKSİ",
          headingValue: "15.200",
          badge: "-%20",
          rows: [
            { label: "Zirve (Mayıs)", value: "15.200" },
            { label: "Bugün", value: "12.900" }
          ],
          footnote: "ÖRNEK VERİDİR. YATIRIM TAVSİYESİ DEĞİLDİR."
        };
        var DUR = 8;
        var root = document.getElementById("mk-sb-root");
        root.style.setProperty("--acc", CONFIG.accent);
        document.getElementById("mk-sb-heading").textContent = CONFIG.heading;
        document.getElementById("mk-sb-badge").textContent = CONFIG.badge;
        document.getElementById("mk-sb-headval").textContent = CONFIG.headingValue;
        document.getElementById("mk-sb-foot").textContent = CONFIG.footnote;
        var rowsEl = document.getElementById("mk-sb-rows");
        var icons = ["1️⃣", "2️⃣"];
        var rowEls = (CONFIG.rows || []).map(function (r, i) {
          var d = document.createElement("div"); d.className = "mk-sb-row";
          var ic = document.createElement("div"); ic.className = "mk-sb-row-icon"; ic.textContent = icons[i] || CONFIG.icon;
          var v = document.createElement("div"); v.className = "mk-sb-row-value"; v.textContent = r.value;
          var l = document.createElement("div"); l.className = "mk-sb-row-label"; l.textContent = r.label;
          d.appendChild(ic); d.appendChild(v); d.appendChild(l); rowsEl.appendChild(d); return d;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.to("#mk-sb-heading", { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.1);
        tl.to("#mk-sb-badge", { opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.45);
        rowEls.forEach(function (el, i) {
          tl.to(el, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.85 + i * 0.4);
        });
        tl.to("#mk-sb-headval", { opacity: 1, duration: 0.45 }, 1.8);
        tl.to("#mk-sb-foot", { opacity: 1, duration: 0.5 }, 2.2);
        tl.to(
          ["#mk-sb-heading", "#mk-sb-badge", "#mk-sb-headval", "#mk-sb-foot"].concat(rowEls),
          { opacity: 0, duration: 0.35, ease: "power2.in" },
          DUR - 0.5
        );
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-scene-break-grid"] = tl;
      })();
    </script>
  </body>
</html>
