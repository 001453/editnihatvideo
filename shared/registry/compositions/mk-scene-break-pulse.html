<!-- hyperframes-registry-item: mk-scene-break-pulse -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* KİLİT (2026-10): bu kök varsayılan visibility:hidden ile başlar,
         GSAP tl.set(...,0.001) ile görünür yapılır, DUR-0.02'de yine
         gizlenir. Tam gerekçe: shared/PRO_CARDS.md "KİLİT (2026-10, KÖK
         SEBEP)" bölümü. mk-scene-break.html ile BİREBİR aynı mekanizma —
         burada değiştirme, sadece aşağıdaki iç tasarımı değiştir. */
      #mk-sb-root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
        background: radial-gradient(120% 60% at 50% 32%, #1c1430 0%, #0a0a10 60%);
        visibility: hidden;
      }

      #mk-sb-pulse-wrap { position: absolute; left: 50%; top: 420px; transform: translateX(-50%); width: 360px; height: 360px; }
      .mk-sb-ring {
        position: absolute; left: 50%; top: 50%; width: 360px; height: 360px; margin: -180px 0 0 -180px;
        border-radius: 50%; border: 3px solid var(--acc, #ff4d4d); opacity: 0; transform: scale(0.4);
      }
      #mk-sb-ico {
        position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px;
        border-radius: 50%; background: linear-gradient(150deg, var(--acc, #ff4d4d), rgba(255,255,255,0.15));
        display: flex; align-items: center; justify-content: center; font-size: 72px; opacity: 0;
      }
      #mk-sb-heading {
        position: absolute; left: 0; top: 840px; width: 1080px; text-align: center;
        font-weight: 800; font-size: 30px; color: #f2f2f6; opacity: 0;
      }
      #mk-sb-headval {
        position: absolute; left: 0; top: 890px; width: 1080px; text-align: center;
        font-weight: 800; font-size: 54px; color: var(--acc, #ff4d4d); opacity: 0;
      }
      #mk-sb-badge {
        position: absolute; left: 50%; top: 1000px; transform: translateX(-50%); padding: 10px 24px;
        border-radius: 999px; font-weight: 800; font-size: 20px; color: #14151f;
        background: var(--acc, #ff4d4d); opacity: 0; white-space: nowrap;
      }
      #mk-sb-rows { position: absolute; left: 60px; top: 1100px; width: 960px; display: flex; flex-direction: column; gap: 18px; }
      .mk-sb-row { display: flex; justify-content: space-between; padding: 22px 30px; border-radius: 18px; background: rgba(255,255,255,0.06); opacity: 0; }
      .mk-sb-row-label { font-weight: 650; font-size: 23px; color: #d8d8e2; }
      .mk-sb-row-value { font-weight: 800; font-size: 27px; color: #ffffff; }
      #mk-sb-foot { position: absolute; left: 60px; bottom: 140px; width: 960px; font-size: 18px; font-weight: 650; color: rgba(255,255,255,0.5); opacity: 0; }

    </style>
  </head>
  <body>
    <div id="mk-sb-root" data-composition-id="mk-scene-break-pulse" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-sb-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-sb-pulse-wrap">
          <div class="mk-sb-ring" id="mk-sb-ring1"></div>
          <div class="mk-sb-ring" id="mk-sb-ring2"></div>
          <div id="mk-sb-ico">📊</div>
        </div>
        <div id="mk-sb-heading"></div>
        <div id="mk-sb-headval"></div>
        <div id="mk-sb-badge"></div>
        <div id="mk-sb-rows"></div>
        <div id="mk-sb-foot"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#ff4d4d",
          icon: "📊",
          heading: "BİST100 ENDEKSİ",
          headingValue: "15.200",
          badge: "-%20",
          rows: [
            { label: "Zirve (Mayıs)", value: "15.200" },
            { label: "Bugün", value: "12.900" }
          ],
          footnote: "ÖRNEK VERİDİR. YATIRIM TAVSİYESİ DEĞİLDİR."
        };
        var DUR = 8;
        var root = document.getElementById("mk-sb-root");
        root.style.setProperty("--acc", CONFIG.accent);
        document.getElementById("mk-sb-ico").textContent = CONFIG.icon;
        document.getElementById("mk-sb-heading").textContent = CONFIG.heading;
        document.getElementById("mk-sb-headval").textContent = CONFIG.headingValue;
        document.getElementById("mk-sb-badge").textContent = CONFIG.badge;
        document.getElementById("mk-sb-foot").textContent = CONFIG.footnote;
        var rowsEl = document.getElementById("mk-sb-rows");
        var rowEls = (CONFIG.rows || []).map(function (r) {
          var d = document.createElement("div"); d.className = "mk-sb-row";
          var l = document.createElement("div"); l.className = "mk-sb-row-label"; l.textContent = r.label;
          var v = document.createElement("div"); v.className = "mk-sb-row-value"; v.textContent = r.value;
          d.appendChild(l); d.appendChild(v); rowsEl.appendChild(d); return d;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.to("#mk-sb-ico", { opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.1);
        tl.fromTo("#mk-sb-ring1", { opacity: 0.8, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 1.0, ease: "power1.out" }, 0.3);
        tl.fromTo("#mk-sb-ring2", { opacity: 0.6, scale: 0.4 }, { opacity: 0, scale: 1.3, duration: 1.0, ease: "power1.out" }, 0.65);
        tl.to("#mk-sb-heading", { opacity: 1, duration: 0.4 }, 1.1);
        tl.to("#mk-sb-headval", { opacity: 1, duration: 0.4 }, 1.35);
        tl.to("#mk-sb-badge", { opacity: 1, duration: 0.4, ease: "back.out(2)" }, 1.65);
        rowEls.forEach(function (el, i) {
          tl.to(el, { opacity: 1, duration: 0.4, ease: "power2.out" }, 2.05 + i * 0.4);
        });
        tl.to("#mk-sb-foot", { opacity: 1, duration: 0.5 }, 2.4 + rowEls.length * 0.4);
        tl.to(
          ["#mk-sb-ico", "#mk-sb-heading", "#mk-sb-headval", "#mk-sb-badge", "#mk-sb-foot"].concat(rowEls),
          { opacity: 0, duration: 0.35, ease: "power2.in" },
          DUR - 0.5
        );
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-scene-break-pulse"] = tl;
      })();
    </script>
  </body>
</html>
