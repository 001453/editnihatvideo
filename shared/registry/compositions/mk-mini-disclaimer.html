<!-- hyperframes-registry-item: mk-mini-disclaimer -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
      }
      #mk-md-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
      }
      #mk-md-text {
        position: absolute;
        max-width: 900px;
        font-weight: 500;
        font-style: italic;
        font-size: 24px;
        line-height: 1.3;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div
      id="mk-md-root"
      data-composition-id="mk-mini-disclaimer"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="1080"
    >
      <div id="mk-md-text"></div>
      <div
        id="mk-md-drv"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* ---- published parameters (inspector-style CONFIG) ----
           A small persistent italic note that can run alongside a
           data/simulation beat (separate from the end "YATIRIM
           TAVSİYESİ DEĞİL" banner). Keep it short — one line if
           possible. Position it low, clear of the karaoke caption
           band and clear of the face. */
        var CONFIG = {
          text: "Simülasyondur, yatırım tavsiyesi değildir.",
          x: 0, // internal canvas units — position with the outer
          y: 0, // timeline.json x/y/scale instead (see shared/PRO_CARDS.md)
          animationIn: true,
          animationOut: true,
        };

        var DUR = 8;
        var root = document.getElementById("mk-md-root");
        var textEl = document.getElementById("mk-md-text");
        textEl.textContent = CONFIG.text;

        textEl.style.left = CONFIG.x + "px";
        textEl.style.top = CONFIG.y + "px";

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          gsap.set(textEl, { opacity: 0 });
          tl.to(textEl, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1);
        }

        if (CONFIG.animationOut) {
          tl.to(textEl, { opacity: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.4);
        }
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);

        window.__timelines["mk-mini-disclaimer"] = tl;
      })();
    </script>
  </body>
</html>
