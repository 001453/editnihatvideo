<!-- hyperframes-registry-item: mk-scene-break-stack -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* KİLİT (2026-10): visibility:hidden varsayılan + tl.set(...,0.001) görünür + DUR-0.02 gizle.
         mk-scene-break.html ile BİREBİR aynı mekanizma — sadece iç tasarım değişir. */
      #mk-sb-root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
        background: linear-gradient(0deg,#1a1208 0%,#09090f 70%);
        visibility: hidden;
      }
      #mk-sb-badge { position:absolute; left:70px; top:700px; padding:12px 28px; border-radius:14px; font-weight:800; font-size:23px; color:#14151f; background:var(--acc,#ff4d4d); opacity:0; white-space:nowrap; }
      #mk-sb-heading { position:absolute; left:70px; top:780px; width:940px; font-weight:700; font-size:28px; letter-spacing:0.1em; color:#9a9ab0; opacity:0; }
      #mk-sb-headwrap { position:absolute; left:70px; top:830px; width:940px; opacity:0; }
      #mk-sb-ico { font-size:70px; vertical-align:middle; margin-right:20px; }
      #mk-sb-headval { font-weight:900; font-size:150px; line-height:1; color:#fff; letter-spacing:-0.03em; }
      #mk-sb-rows { position:absolute; left:70px; top:1070px; width:940px; display:flex; flex-direction:column; gap:20px; }
      .mk-sb-row { position:relative; border-radius:18px; background:rgba(255,255,255,0.07); padding:28px 34px; overflow:hidden; display:flex; justify-content:space-between; align-items:center; opacity:0; }
      .mk-sb-row::before { content:""; position:absolute; left:0; top:0; bottom:0; width:10px; background:var(--acc,#ff4d4d); }
      .mk-sb-row-label { font-weight:650; font-size:26px; color:#c8c8d4; }
      .mk-sb-row-value { font-weight:800; font-size:34px; color:var(--acc,#ff4d4d); text-align:right; }
      #mk-sb-foot { position:absolute; left:70px; bottom:150px; width:940px; font-size:18px; font-weight:650; color:rgba(255,255,255,0.5); opacity:0; }
    </style>
  </head>
  <body>
    <div id="mk-sb-root" data-composition-id="mk-scene-break-stack" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-sb-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-sb-badge"></div>
        <div id="mk-sb-heading"></div>
        <div id="mk-sb-headwrap"><span id="mk-sb-ico">📊</span><span id="mk-sb-headval"></span></div>
        <div id="mk-sb-rows"></div>
        <div id="mk-sb-foot"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#ff4d4d",
          icon: "📊",
          heading: "BİST100 ENDEKSİ",
          headingValue: "15.200",
          badge: "-%20",
          rows: [
            { label: "Zirve (Mayıs)", value: "15.200" },
            { label: "Bugün", value: "12.900" }
          ],
          footnote: "ÖRNEK VERİDİR. YATIRIM TAVSİYESİ DEĞİLDİR."
        };
        var DUR = 8;
        var root = document.getElementById("mk-sb-root");
        root.style.setProperty("--acc", CONFIG.accent);
        function T(id, v) { document.getElementById(id).textContent = v; }
        T("mk-sb-ico", CONFIG.icon); T("mk-sb-heading", CONFIG.heading); T("mk-sb-badge", CONFIG.badge); T("mk-sb-foot", CONFIG.footnote);
        var hv = document.getElementById("mk-sb-headval"); if (hv) hv.textContent = CONFIG.headingValue;
        var rowsEl = document.getElementById("mk-sb-rows");
        var rowEls = (CONFIG.rows || []).map(function (r, i) {
          var d = document.createElement("div"); d.className = "mk-sb-row";
          var l = document.createElement("div"); l.className = "mk-sb-row-label"; l.textContent = r.label;
          var v = document.createElement("div"); v.className = "mk-sb-row-value"; v.textContent = r.value;
          d.appendChild(l); d.appendChild(v);
          rowsEl.appendChild(d); return d;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.fromTo("#mk-sb-badge", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.1);
        tl.fromTo("#mk-sb-heading", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
        tl.fromTo("#mk-sb-headwrap", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
        rowEls.forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.3 + i * 0.35);
        });
        tl.to("#mk-sb-foot", { opacity: 1, duration: 0.5 }, 2.2);
        tl.to(["#mk-sb-badge","#mk-sb-heading","#mk-sb-headwrap","#mk-sb-foot"].concat(rowEls), { opacity: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.5);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-scene-break-stack"] = tl;
      })();
    </script>
  </body>
</html>
