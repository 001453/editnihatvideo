<!-- hyperframes-registry-item: mk-scene-break-steps -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      /* KİLİT (2026-10): visibility:hidden varsayılan + tl.set(...,0.001) görünür + DUR-0.02 gizle.
         mk-scene-break.html ile BİREBİR aynı mekanizma — sadece iç tasarım değişir. */
      #mk-sb-root {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        font-family: "Montserrat", "Inter", -apple-system, sans-serif;
        background: radial-gradient(120% 80% at 0% 50%,#12201a 0%,#090a10 65%);
        visibility: hidden;
      }
      #mk-sb-badge { position:absolute; left:90px; top:300px; padding:12px 28px; border-radius:999px; font-weight:800; font-size:22px; color:#14151f; background:var(--acc,#ff4d4d); opacity:0; white-space:nowrap; }
      #mk-sb-heading { position:absolute; left:90px; top:380px; width:900px; font-weight:800; font-size:50px; line-height:1.15; color:#fff; opacity:0; }
      #mk-sb-headwrap { position:absolute; left:90px; top:530px; width:900px; opacity:0; }
      #mk-sb-ico { font-size:46px; vertical-align:middle; margin-right:16px; }
      #mk-sb-headval { font-weight:800; font-size:64px; color:var(--acc,#ff4d4d); }
      #mk-sb-rows { position:absolute; left:90px; top:700px; width:900px; display:flex; flex-direction:column; gap:34px; counter-reset:st; }
      #mk-sb-line { position:absolute; left:121px; top:735px; width:4px; height:0; background:var(--acc,#ff4d4d); opacity:0.55; border-radius:2px; }
      .mk-sb-row { position:relative; padding-left:110px; opacity:0; counter-increment:st; min-height:100px; }
      .mk-sb-row::before { content:counter(st); position:absolute; left:0; top:0; width:64px; height:64px; border-radius:50%; background:var(--acc,#ff4d4d); color:#14151f; font-weight:900; font-size:30px; display:flex; align-items:center; justify-content:center; }
      .mk-sb-row-label { font-weight:700; font-size:26px; color:#a9b3ae; margin-bottom:8px; }
      .mk-sb-row-value { font-weight:800; font-size:42px; line-height:1.15; color:#fff; }
      #mk-sb-foot { position:absolute; left:90px; bottom:150px; width:900px; font-size:18px; font-weight:650; color:rgba(255,255,255,0.5); opacity:0; }
    </style>
  </head>
  <body>
    <div id="mk-sb-root" data-composition-id="mk-scene-break-steps" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div id="mk-sb-clip" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute;left:0;top:0;width:1080px;height:1920px">
        <div id="mk-sb-badge"></div>
        <div id="mk-sb-heading"></div>
        <div id="mk-sb-headwrap"><span id="mk-sb-ico">📊</span><span id="mk-sb-headval"></span></div>
        <div id="mk-sb-line"></div>
        <div id="mk-sb-rows"></div>
        <div id="mk-sb-foot"></div>
      </div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          accent: "#ff4d4d",
          icon: "📊",
          heading: "BİST100 ENDEKSİ",
          headingValue: "15.200",
          badge: "-%20",
          rows: [
            { label: "Zirve (Mayıs)", value: "15.200" },
            { label: "Bugün", value: "12.900" }
          ],
          footnote: "ÖRNEK VERİDİR. YATIRIM TAVSİYESİ DEĞİLDİR."
        };
        var DUR = 8;
        var root = document.getElementById("mk-sb-root");
        root.style.setProperty("--acc", CONFIG.accent);
        function T(id, v) { document.getElementById(id).textContent = v; }
        T("mk-sb-ico", CONFIG.icon); T("mk-sb-heading", CONFIG.heading); T("mk-sb-badge", CONFIG.badge); T("mk-sb-foot", CONFIG.footnote);
        var hv = document.getElementById("mk-sb-headval"); if (hv) hv.textContent = CONFIG.headingValue;
        var rowsEl = document.getElementById("mk-sb-rows");
        var rowEls = (CONFIG.rows || []).map(function (r, i) {
          var d = document.createElement("div"); d.className = "mk-sb-row";
          var l = document.createElement("div"); l.className = "mk-sb-row-label"; l.textContent = r.label;
          var v = document.createElement("div"); v.className = "mk-sb-row-value"; v.textContent = r.value;
          d.appendChild(l); d.appendChild(v);
          rowsEl.appendChild(d); return d;
        });
        var tl = gsap.timeline({ paused: true });
        tl.set(root, { visibility: "visible" }, 0.001);
        tl.to("#mk-sb-badge", { opacity: 1, duration: 0.4 }, 0.1);
        tl.fromTo("#mk-sb-heading", { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.3);
        tl.to("#mk-sb-headwrap", { opacity: 1, duration: 0.5 }, 0.7);
        tl.to("#mk-sb-line", { height: 190, duration: 1.4, ease: "power2.inOut" }, 1.2);
        rowEls.forEach(function (el, i) {
          tl.fromTo(el, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.3 + i * 0.9);
        });
        tl.to("#mk-sb-foot", { opacity: 1, duration: 0.5 }, 3.4);
        tl.to(["#mk-sb-badge","#mk-sb-heading","#mk-sb-headwrap","#mk-sb-line","#mk-sb-foot"].concat(rowEls), { opacity: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.5);
        tl.set(root, { visibility: "hidden" }, DUR - 0.02);
        window.__timelines["mk-scene-break-steps"] = tl;
      })();
    </script>
  </body>
</html>
