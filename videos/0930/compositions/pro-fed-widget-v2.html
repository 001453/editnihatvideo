           A small dark finance-app widget card: icon badge, big

           value/max. Inspired by app-mockup / hero-stat widgets. */
        var CONFIG = {
          value: 70,
          suffix: "%",
          label: "FED İNDİRİM İHTİMALİ",
          max: 100, // bar fills to value/max
          accent: "#f5b942",
          x: 220, // card left edge; null = centered
          y: 160, // card top edge; null = centered
          animationIn: true,
          animationOut: true,

        var DUR = 6;
        var root = document.getElementById("mk-wg-root");
        var card = document.getElementById("mk-wg-card");
        var valueEl = document.getElementById("mk-wg-value");
        var glow = document.getElementById("mk-wg-glow");

        document.getElementById("mk-wg-label").textContent = CONFIG.label;
        valueEl.textContent = CONFIG.value + CONFIG.suffix;
        glow.style.background = CONFIG.accent;
        glow.style.boxShadow = "0 0 18px 3px " + CONFIG.accent + "bf";

        if (CONFIG.animationIn) {
